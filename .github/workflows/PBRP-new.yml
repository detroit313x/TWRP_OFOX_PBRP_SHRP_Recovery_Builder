name: Experimental Kansas PBRP compile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Free hosted-runner disk and install Android dependencies
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk python3 cpio
          df -h
      - name: Sync current documented stable PBRP sources
        run: |
          mkdir -p "$HOME/bin" android-recovery build-evidence
          curl -fL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          export PATH="$HOME/bin:$PATH"
          git config --global user.name 'detroit313x'
          git config --global user.email 'detroit313x@users.noreply.github.com'
          cd android-recovery
          repo init --depth=1 -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git -b android-12.1
          set -o pipefail
          repo sync -c --no-tags --no-clone-bundle --force-sync -j4 2>&1 | tee ../build-evidence/sync.log
          repo manifest -r > ../build-evidence/resolved-manifest.xml
          mkdir -p device/motorola/kansas
          cp -a ../kansas-build/device/. device/motorola/kansas/
          df -h
      - name: Compile experimental recovery vendor_boot image
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"
          cd android-recovery
          set +e
          source build/envsetup.sh
          set -e
          set -o pipefail
          # A pipeline runs lunch in a subshell and loses its exported target.
          # Redirect through process substitution so target selection persists.
          lunch pb_kansas-eng > >(tee ../build-evidence/lunch.log) 2>&1
          test "$TARGET_PRODUCT" = pb_kansas
          test "$(get_build_var TARGET_ARCH)" = arm64
          get_build_var TW_THEME | tee ../build-evidence/theme-make.txt
          m -j4 TARGET_PRODUCT=pb_kansas TARGET_BUILD_VARIANT=eng vendorbootimage 2>&1 | tee ../build-evidence/compile.log
          test -s out/target/product/kansas/vendor_boot.img
          # Keep stock platform before recovery in table and physical layout.
          # Bootloader fragment-selection/reordering still requires device testing.
          python3 ../kansas-build/tools/test_reorder_vendor_fragments.py
          python3 ../kansas-build/tools/reorder_vendor_fragments.py \
            out/target/product/kansas/vendor_boot.img \
            ../build-evidence/EXPERIMENTAL-UNTESTED-vendor_boot.img \
            > ../build-evidence/fragment-order.json
          sha256sum ../build-evidence/EXPERIMENTAL-UNTESTED-vendor_boot.img > ../build-evidence/SHA256SUMS
          cp ../kansas-build/REFERENCE.md ../build-evidence/
      - name: Collect failure evidence
        if: always()
        run: |
          mkdir -p build-evidence
          df -h > build-evidence/disk-final.txt
          find android-recovery/out -name '*.log' -o -name 'soong.log' -o -name '*error*' 2>/dev/null | head -30 > build-evidence/log-paths.txt || true
          for f in android-recovery/out/soong/build.ninja.d android-recovery/out/verbose.log.gz android-recovery/out/error.log android-recovery/out/soong/soong.variables; do
            if [ -f "$f" ]; then cp "$f" build-evidence/; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Kansas-PBRP-experimental-build-evidence
          path: build-evidence/
          retention-days: 14
